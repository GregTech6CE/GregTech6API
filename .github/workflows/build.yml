name: API build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew -p common --no-daemon check assemble
      - uses: actions/upload-artifact@v4
        with:
          name: gt6ce-api-common
          path: common/build/libs/*.jar
          if-no-files-found: error
  platform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['1.20.1-forge', '1.21.1-neoforge']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: echo "JAVA21_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: echo "JAVA17_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon ":api-platform:${{ matrix.node }}:build"
      - uses: actions/upload-artifact@v4
        with:
          name: gt6ce-api-${{ matrix.node }}
          path: |
            common/build/libs/*.jar
            minecraft/versions/${{ matrix.node }}/build/libs/*.jar
          if-no-files-found: error
